<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- 1. Technical Speed Optimization (Hardware Threading) -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <link rel="manifest" href="/manifest.json" crossorigin="use-credentials" />
    <meta name="theme-color" content="#4f46e5" />

    <!-- 2. High-Traffic SEO Title (Targeting Top Keywords Directly) -->
    <title>
      TaskMaster — Best Free Online Task Manager & Modern To-Do List
    </title>

    <!-- 3. Dynamic Keyword Injection & High Intent Meta Description -->
    <meta
      name="description"
      content="TaskMaster is the ultimate free online task manager and minimalist to-do list app. Built with React and TypeScript for hyper-fast privacy-first tracking of your tasks, daily habits, and draft priorities."
    />

    <!-- 🚀 MASTER SEO KEYWORDS (Optimized for 2026 High Intent Traffic Trends) -->
    <meta
      name="keywords"
      content="task manager, best free task manager app, online to-do list, react todo app, typescript task manager, daily planner online, minimalist productivity tool, privacy first todo list, workflow dashboard, personal organizer web app, localstorage todo manager, fast task tracker, track tasks and drafts"
    />

    <meta
      name="robots"
      content="index, follow, max-image-preview:large, max-snippet:-1"
    />
    <meta name="author" content="TaskMaster Team" />
    <link rel="canonical" href="https://your-taskmaster-domain.com" />

    <!-- 4. Global Social Media Indexing Optimization (Open Graph) -->
    <meta property="og:locale" content="en_US" />
    <meta property="og:site_name" content="TaskMaster" />
    <meta
      property="og:title"
      content="TaskMaster — Best Free Online Task Manager App"
    />
    <meta
      property="og:description"
      content="Boost your workflow speed and manage your everyday routine with the best minimalist to-do list app."
    />
    <meta
      property="og:image"
      content="https://your-taskmaster-domain.comfavicon.png"
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://your-taskmaster-domain.com" />

    <!-- 5. X / Twitter Search Optimization Configuration -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="TaskMaster — High Performance Task Tracker"
    />
    <meta
      name="twitter:description"
      content="The privacy-first minimalist task manager online tool. Organize your day instantly."
    />
    <meta
      name="twitter:image"
      content="https://your-taskmaster-domain.comfavicon.png"
    />
  </head>
  <body class="antialiased text-slate-800 bg-slate-50">
    <noscript>
      <div
        style="
          text-align: center;
          padding: 20px;
          font-family: sans-serif;
          background: #fee2e2;
          color: #991b1b;
        "
      >
        <strong>JavaScript Required:</strong> TaskMaster relies on high-speed
        components to function securely. Please enable JavaScript in your
        browser settings.
      </div>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
